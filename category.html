<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Showcase | NOORCART</title>

    <link rel="icon" type="image/png" href="assets/images/logo-noorcart.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- MAIN HEADER -->
    <header class="main-header sticky-top bg-white border-bottom shadow-sm">
        <div class="container py-2">
            <div class="row align-items-center g-2">
                <div class="col-4 col-md-3 col-lg-2">
                    <a href="index.html" class="text-decoration-none text-dark fw-bold fs-4 d-flex align-items-center">
                        <img src="assets/images/logo-noorcart.png" alt="NOORCART Logo" style="max-height: 40px;"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
                        <span style="display:none;" class="fw-bold text-primary fs-4">NOORCART</span>
                    </a>
                </div>

                <div class="col-12 col-md-5 col-lg-6 order-3 order-md-2">
                    <div class="input-group">
                        <input type="text" id="filterSearch" class="form-control rounded-start-pill ps-3"
                            placeholder="Search category items...">
                        <button class="btn btn-primary rounded-end-pill px-4" type="button">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>
                </div>

                <div
                    class="col-8 col-md-4 col-lg-4 order-2 order-md-3 d-flex align-items-center justify-content-end gap-2">
                    <button class="theme-toggle-btn" id="themeToggle" type="button" aria-label="Toggle Theme">
                        <i class="fa-solid fa-moon fs-5"></i>
                    </button>

                    <button class="btn border-0 position-relative p-2" onclick="toggleCartDrawer(true)"
                        aria-label="Open Cart">
                        <i class="fa-solid fa-bag-shopping fs-4 text-dark"></i>
                        <span class="cart-badge" id="cartBadgeCount">0</span>
                    </button>

                    <a href="category.html?type=perfumes"
                        class="d-none d-sm-inline-flex align-items-center text-dark text-decoration-none border rounded-pill px-3 py-1 bg-light shadow-sm">
                        <img src="assets/images/logo-noorulain.png" alt="Noor-Ul-Ain" style="height: 28px; width: 28px;"
                            class="me-2 rounded-circle" onerror="this.style.display='none';">
                        <span class="fw-bold text-dark" style="font-size: 0.75rem;">Perfumes</span>
                    </a>
                </div>
            </div>
        </div>

        <nav class="navbar navbar-expand-lg bg-white border-top py-1">
            <div class="container">
                <button class="btn btn-primary btn-sm me-2 d-lg-none" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNav">
                    <i class="fa-solid fa-bars me-1"></i> Menu
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="shop.html">Shop All</a></li>
                        <li class="nav-item"><a class="nav-link active text-primary"
                                href="category.html?type=perfumes">Perfumes</a></li>
                        <li class="nav-item"><a class="nav-link" href="category.html?cat=men-unstitched">Men</a></li>
                        <li class="nav-item"><a class="nav-link" href="category.html?cat=women-unstitched">Women</a>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="category.html?cat=sports">Sports</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- BANNER FOR CATEGORY -->
    <section class="py-4 bg-dark text-white text-center">
        <div class="container">
            <img src="assets/images/logo-noorulain.png" alt="Brand Logo" style="height: 50px;"
                class="mb-2 rounded-circle" onerror="this.style.display='none';">
            <h1 class="h2 fw-bold text-warning mb-1">Exclusive Category Showcase</h1>
            <p class="text-white-50 small mb-0">Browse through our handpicked signature offerings</p>
        </div>
    </section>

    <!-- MAIN PRODUCT LISTING -->
    <section class="py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                <span id="productCount" class="fw-bold text-muted">Showing products</span>
                <div class="d-flex align-items-center gap-2">
                    <label for="sortSelect" class="text-nowrap small fw-bold">Sort By:</label>
                    <select id="sortSelect" class="form-select form-select-sm rounded-pill w-auto">
                        <option value="newest">Newest First</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="name-az">Name: A to Z</option>
                    </select>
                </div>
            </div>

            <!-- DYNAMIC PRODUCT GRID -->
            <div class="row g-4" id="productGrid"></div>
        </div>
    </section>

    <!-- CART DRAWER & OVERLAY -->
    <div class="cart-drawer-overlay" id="cartOverlay" onclick="toggleCartDrawer(false)"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h5 class="fw-bold mb-0"><i class="fa-solid fa-bag-shopping me-2 text-primary"></i>Your Cart</h5>
            <button type="button" class="btn-close" onclick="toggleCartDrawer(false)"></button>
        </div>
        <div class="cart-body" id="cartItemList"></div>
        <div class="cart-footer">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fw-bold text-muted">Subtotal:</span>
                <span class="fw-bold fs-5 text-success" id="cartTotalDisplay">PKR 0</span>
            </div>
            <button onclick="checkoutViaWhatsApp()" class="btn btn-success w-100 py-2 fw-bold rounded-pill">
                <i class="fa-brands fa-whatsapp me-2 fs-5"></i> Checkout on WhatsApp
            </button>
        </div>
    </div>

    <!-- FLOATING WHATSAPP BUTTON -->
    <a href="https://wa.me/923400085347?text=Hello%20NOORCART,%20I%20have%20a%20query%20about%20your%20products."
        target="_blank" class="floating-whatsapp" aria-label="Order on WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/shop.js"></script>
    <!-- SCRIPT DEPENDENCIES -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- CUSTOM JS ENGINE -->
    <script src="assets/js/shop.js"></script>

    <!-- INITIALIZE AOS ANIMATIONS -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof AOS !== 'undefined') {
                AOS.init({
                    duration: 800,
                    once: true
                });
            }
        });
    </script>
</body>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const themeBtn = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('noorcart_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (themeBtn) {
            themeBtn.innerHTML = savedTheme === 'dark' ? '<i class="fa-solid fa-sun text-warning fs-5"></i>' : '<i class="fa-solid fa-moon text-dark fs-5"></i>';
            themeBtn.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('noorcart_theme', next);
                themeBtn.innerHTML = next === 'dark' ? '<i class="fa-solid fa-sun text-warning fs-5"></i>' : '<i class="fa-solid fa-moon text-dark fs-5"></i>';
            });
        }
    });
</script>
</body>

</html>
